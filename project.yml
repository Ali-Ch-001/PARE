name: Pare
options:
  bundleIdPrefix: com.pare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Pare:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Pare
        excludes:
          - Tests
          - Docs
    resources:
      - Pare/App/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pare.curation
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: Pare/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Pare/Bridge/PareEngineBridge.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Pare/CoreEngine/include
          - $(SRCROOT)/Pare/Bridge
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: Photos.framework
      - sdk: BackgroundTasks.framework
      - sdk: UserNotifications.framework
      - sdk: CoreVideo.framework
      - sdk: Vision.framework

schemes:
  Pare:
    build:
      targets:
        Pare: all
    run:
      config: Debug
      storeKitConfiguration: Pare/Pare.storekit
    archive:
      config: Release
